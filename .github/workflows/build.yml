name: Build TIM Anti-Revoke (macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/timrevoke/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install ldid xz dpkg

      - name: Setup Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C $HOME/theos/sdks --strip-components=1
          ls $HOME/theos/sdks

      - name: Build (arm64)
        run: |
          export THEOS=$HOME/theos
          cd src/timrevoke
          make clean
          make package FINALPACKAGE=1 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          ls -la packages/

      - name: Repack deb to gzip (iOS 兼容)
        run: |
          cd "$GITHUB_WORKSPACE/src/timrevoke/packages"
          python3 "$GITHUB_WORKSPACE/.github/scripts/repack_gzip.py"

      - name: Verify deb (control 单行 + gzip + 架构，防 Bad Deb)
        run: |
          cd "$GITHUB_WORKSPACE/src/timrevoke/packages"
          for d in *.deb; do
            dpkg-deb -I "$d" > /dev/null
            dpkg-deb -c "$d" > /dev/null
          done
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify_deb.py"

      - name: Verify binary
        run: |
          cd "$GITHUB_WORKSPACE/src/timrevoke"
          DYLIB=$(find .theos -name "TIMAntiRevoke.dylib" | head -1)
          echo "== dylib =="
          file "$DYLIB"
          lipo -info "$DYLIB"

      - name: Publish build log (for debugging)
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build.log
          if git diff --cached --quiet; then echo "日志无变化"; else
            git commit -m "CI: build log [skip ci]"; git push
          fi

      - name: Publish to repo (deb + Packages 索引)（仅手动触发时发布进源）
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -f debs/com.xiaofei.timantirevoke_*.deb
          cp src/timrevoke/packages/*.deb debs/
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -k -f Packages
          xz -k -f Packages

          # 生成 Release 元数据（含 Packages 校验和），否则 Sileo 添加源时校验失败
          python3 - <<'PY'
          import hashlib, datetime
          files = ["Packages","Packages.gz","Packages.xz"]
          now = datetime.datetime.utcnow().strftime('%a, %d %b %Y %H:%M:%S UTC')
          lines = [
            "Origin: xiaofei",
            "Label: xiaofei",
            "Suite: stable",
            "Version: 1.0",
            "Codename: xiaofei",
            "Architectures: iphoneos-arm64 iphoneos-arm64e",
            "Components: main",
            "Description: xiaofei 的 Sileo 越狱插件源 — 自制 tweak + 同步插件",
            f"Date: {now}",
          ]
          for algo, name in [("md5","MD5Sum"),("sha1","SHA1"),("sha256","SHA256")]:
            lines.append(name + ":")
            for f in files:
              data = open(f,"rb").read()
              lines.append(f" {hashlib.new(algo, data).hexdigest()}  {len(data)}  {f}")
          open("Release","w").write("\n".join(lines) + "\n")
          print(open("Release").read())
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debs Packages Packages.gz Packages.xz Release
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "CI: macOS 编译 TIM 防撤回 [skip ci]"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src/timrevoke/packages/*.deb
