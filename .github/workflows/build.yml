name: Build ReturnKeyColor (macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/returnkeycolor/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install ldid xz dpkg

      - name: Setup Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C $HOME/theos/sdks --strip-components=1
          ls $HOME/theos/sdks

      - name: Build (arm64 + arm64e fat binary)
        run: |
          export THEOS=$HOME/theos
          export THEOS_SDK_PATH="$THEOS/sdks/iPhoneOS.sdk"

          # ---- 诊断：用 swiftc 包装脚本捕获 Theos 实际传给 swiftc 的完整命令 ----
          REAL_SWIFTC=$(xcrun -f swiftc || echo /usr/bin/swiftc)
          mkdir -p "$HOME/bin"
          cat > "$HOME/bin/swiftc" <<'SHIM'
          #!/bin/bash
          echo "===== SWIFTC INVOKED =====" >&2
          echo "PWD: $(pwd)" >&2
          echo "ARGS: $*" >&2
          echo "==========================" >&2
          exec "$REAL_SWIFTC_REAL" "$@"
          SHIM
          # 把真实路径注入包装脚本（避免递归）
          sed -i.bak "s|\$REAL_SWIFTC_REAL|$REAL_SWIFTC|g" "$HOME/bin/swiftc"
          chmod +x "$HOME/bin/swiftc"
          export PATH="$HOME/bin:$PATH"
          export SWIFT="$HOME/bin/swiftc"

          {
            echo "########## 诊断信息 ##########"
            echo "=== swiftc 版本（系统 xcrun）==="
            xcrun swiftc --version 2>&1 || true
            echo "=== swiftc 版本（THEOS 默认）==="
            "$REAL_SWIFTC" --version 2>&1 || true
            echo "=== SDK 路径: $THEOS_SDK_PATH ==="
            ls -la "$THEOS_SDK_PATH/usr/lib/swift" 2>&1 | head -60 || true
            echo "--- 查找 _Concurrency / _StringProcessing 模块 ---"
            find "$THEOS_SDK_PATH/usr/lib/swift" -maxdepth 3 \( -iname '*Concurrency*' -o -iname '*StringProcessing*' \) 2>/dev/null | head
            echo "--- _Concurrency.swiftmodule 内容（看是 .swiftmodule 还是 .swiftinterface）---"
            ls -la "$THEOS_SDK_PATH/usr/lib/swift/_Concurrency.swiftmodule" 2>&1 | head || true
            echo "=== THEOS vendor/swift-support ==="
            ls -la "$THEOS/vendor/swift-support" 2>&1 | head -40 || true
            find "$THEOS/vendor/swift-support" -maxdepth 4 -iname '*Concurrency*' 2>/dev/null | head
            echo "########## 诊断信息结束 ##########"
            echo
            echo "########## 正式构建 ##########"
            cd src/returnkeycolor
            make clean
            make package FINALPACKAGE=1 2>&1
            echo "########## 构建结束 ##########"
            ls -la packages/ 2>&1 || true
          } | tee "$GITHUB_WORKSPACE/build.log"

      - name: Repack deb to gzip (iOS 兼容)
        run: |
          cd "$GITHUB_WORKSPACE/src/returnkeycolor/packages"
          python3 "$GITHUB_WORKSPACE/.github/scripts/repack_gzip.py"

      - name: Verify deb (control 单行 + gzip + 架构，防 Bad Deb)
        run: |
          cd "$GITHUB_WORKSPACE/src/returnkeycolor/packages"
          for d in *.deb; do
            dpkg-deb -I "$d" > /dev/null
            dpkg-deb -c "$d" > /dev/null
          done
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify_deb.py"

      - name: Verify binary (arm64 + arm64e fat)
        run: |
          cd "$GITHUB_WORKSPACE/src/returnkeycolor"
          DYLIB=$(find .theos -name "ReturnKeyColor.dylib" | head -1)
          echo "== dylib =="
          file "$DYLIB"
          lipo -info "$DYLIB"
          lipo -info "$DYLIB" | grep -q "arm64 arm64e" || lipo -info "$DYLIB" | grep -q "arm64e"

      - name: Publish build log (for debugging)
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build.log
          if git diff --cached --quiet; then echo "日志无变化"; else
            git commit -m "CI: build log [skip ci]"; git push
          fi

      - name: Publish to repo (deb + Packages 索引)（仅手动触发时发布进源）
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -f debs/com.xiaofei.returnkeycolor_*.deb
          cp src/returnkeycolor/packages/*.deb debs/
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -k -f Packages
          xz -k -f Packages

          # 生成 Release 元数据（含 Packages 校验和），否则 Sileo 添加源时校验失败
          python3 - <<'PY'
          import hashlib, datetime
          files = ["Packages","Packages.gz","Packages.xz"]
          now = datetime.datetime.utcnow().strftime('%a, %d %b %Y %H:%M:%S UTC')
          lines = [
            "Origin: xiaofei",
            "Label: xiaofei",
            "Suite: stable",
            "Version: 1.0",
            "Codename: xiaofei",
            "Architectures: iphoneos-arm64 iphoneos-arm64e",
            "Components: main",
            "Description: xiaofei 的 Sileo 越狱插件源 — 自制 tweak + 同步插件",
            f"Date: {now}",
          ]
          for algo, name in [("md5","MD5Sum"),("sha1","SHA1"),("sha256","SHA256")]:
            lines.append(name + ":")
            for f in files:
              data = open(f,"rb").read()
              lines.append(f" {hashlib.new(algo, data).hexdigest()}  {len(data)}  {f}")
          open("Release","w").write("\n".join(lines) + "\n")
          print(open("Release").read())
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debs Packages Packages.gz Packages.xz Release
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "CI: macOS 编译 键盘回车键同色 [skip ci]"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src/returnkeycolor/packages/*.deb
