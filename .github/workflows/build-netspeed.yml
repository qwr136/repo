name: Build NetSpeed

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/netspeed/**'
      - '.github/workflows/build-netspeed.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: brew install ldid xz dpkg

      - name: Setup Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C $HOME/theos/sdks --strip-components=1
          ls $HOME/theos/sdks

      - name: Build (rootless, arm64 + arm64e)
        run: |
          export THEOS=$HOME/theos
          cd src/netspeed
          make clean
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e" 2>&1 | tee "$GITHUB_WORKSPACE/build-netspeed.log"
          ls -la packages/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: netspeed-deb
          path: src/netspeed/packages/*.deb
