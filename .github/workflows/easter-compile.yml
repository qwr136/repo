name: Easter Egg Compile Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Targeted source contracts
        run: |
          python3 tests/easter-regression.py
          python3 tests/preferences-routing.py
          python3 tests/startup-reentry.py
      - name: Theos setup
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          rm -rf "$HOME/theos/sdks"
          mv "$RUNNER_TEMP/theos-sdks" "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          brew install --quiet ldid dpkg make
      - name: Compile only diagnostic package
        run: make clean package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: easter-compile-only-not-release
          path: packages/*.deb
          if-no-files-found: error
