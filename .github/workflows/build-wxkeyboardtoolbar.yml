name: Build WXKeyboardToolbar (macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/wxkeyboardtoolbar/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install ldid xz dpkg

      - name: Setup Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C $HOME/theos/sdks --strip-components=1

      - name: Align theos SDK with Xcode iPhoneOS SDK
        run: |
          export THEOS=$HOME/theos
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)
          SDK_VER=$(basename "$XCODE_SDK" | sed -E 's/^iPhoneOS//; s/\.sdk$//')
          echo "Xcode iPhoneOS SDK: $XCODE_SDK (ver=$SDK_VER)"
          if [ -n "$XCODE_SDK" ]; then
            for d in iPhoneOS.sdk iPhoneOS14.5.sdk "iPhoneOS${SDK_VER}.sdk"; do
              rm -rf "$THEOS/sdks/$d"; ln -s "$XCODE_SDK" "$THEOS/sdks/$d"
            done
            sed -i.bak -E "s/iphone:[0-9.]+:[0-9.]+/iphone:${SDK_VER}:15.0/" src/wxkeyboardtoolbar/Makefile
            echo "=== 改后 TARGET ==="; grep TARGET src/wxkeyboardtoolbar/Makefile
          else
            echo "!!! 未找到 Xcode iPhoneOS SDK"
            exit 1
          fi

      - name: Build (arm64 + arm64e fat)
        run: |
          export THEOS=$HOME/theos
          export THEOS_SDK_PATH="$THEOS/sdks/iPhoneOS.sdk"
          cd src/wxkeyboardtoolbar
          make clean
          make package FINALPACKAGE=1 2>&1 | tee "$GITHUB_WORKSPACE/wx-build.log"
          ls -la packages/

      - name: Repack deb to gzip (iOS 兼容，防 Bad Deb)
        run: |
          cd "$GITHUB_WORKSPACE/src/wxkeyboardtoolbar/packages"
          python3 "$GITHUB_WORKSPACE/.github/scripts/repack_gzip.py"

      - name: Verify deb (control 单行 + gzip + 架构)
        run: |
          cd "$GITHUB_WORKSPACE/src/wxkeyboardtoolbar/packages"
          for d in *.deb; do
            dpkg-deb -I "$d" > /dev/null
            dpkg-deb -c "$d" > /dev/null
          done
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify_deb.py"

      - name: Verify binary (arm64 + arm64e fat)
        run: |
          cd "$GITHUB_WORKSPACE/src/wxkeyboardtoolbar"
          DYLIB=$(find .theos -name "WXKeyboardToolbar.dylib" | head -1)
          echo "== dylib =="
          file "$DYLIB"
          lipo -info "$DYLIB"
          lipo -info "$DYLIB" | grep -q "arm64 arm64e" || lipo -info "$DYLIB" | grep -q "arm64e"

      - name: Publish to repo (deb + Packages 索引) -> main [skip ci]
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE"
          # 1. 先把编好的 deb 存到临时目录，避免被后续清理误删
          mkdir -p /tmp/wxkb_debs
          cp src/wxkeyboardtoolbar/packages/*.deb /tmp/wxkb_debs/
          # 2. 清掉本地未跟踪的索引产物，避免 pull --rebase 因同名文件冲突
          rm -rf debs Packages Packages.gz Packages.xz Release
          # 3. 拉取最新 main（带重试，防网络抖动）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin main && git rebase origin/main && break
            sleep 5
          done
          # 4. 放回 deb 并重新生成索引
          mkdir -p debs
          cp /tmp/wxkb_debs/*.deb debs/
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -k -f Packages
          xz -k -f Packages

          python3 - <<'PY'
          import hashlib, datetime
          files = ["Packages", "Packages.gz", "Packages.xz"]
          now = datetime.datetime.utcnow().strftime('%a, %d %b %Y %H:%M:%S UTC')
          lines = [
            "Origin: xiaofei",
            "Label: xiaofei",
            "Suite: stable",
            "Version: 1.0",
            "Codename: xiaofei",
            "Architectures: iphoneos-arm64 iphoneos-arm64e",
            "Components: main",
            "Description: xiaofei 的 Sileo 越狱插件源",
            f"Date: {now}",
          ]
          for algo, name in [("md5", "MD5Sum"), ("sha1", "SHA1"), ("sha256", "SHA256")]:
            lines.append(name + ":")
            for f in files:
              data = open(f, "rb").read()
              lines.append(f" {hashlib.new(algo, data).hexdigest()}  {len(data)}  {f}")
          open("Release", "w").write("\n".join(lines) + "\n")
          print(open("Release").read())
          PY

          git add debs Packages Packages.gz Packages.xz Release
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "CI: WXKeyboardToolbar build [skip ci]"
            for i in 1 2 3 4; do
              git fetch origin main && git rebase origin/main && git push --force-with-lease origin main && break
              sleep 5
            done
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src/wxkeyboardtoolbar/packages/*.deb
