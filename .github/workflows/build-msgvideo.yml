name: Build MsgVideo (信息视频背景)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/msgvideo/**'
      - '.github/workflows/build-msgvideo.yml'

permissions:
  contents: write

concurrency:
  group: repo-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install ldid xz dpkg

      - name: Setup Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C $HOME/theos/sdks --strip-components=1
          ls $HOME/theos/sdks

      - name: Build (arm64 + arm64e fat binary)
        run: |
          export THEOS=$HOME/theos
          cd src/msgvideo
          make clean
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e" 2>&1 | tee "$GITHUB_WORKSPACE/build-msgvideo.log"
          ls -la packages/

      - name: Publish build log (for debugging)
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f build-msgvideo.log
          if git diff --cached --quiet; then echo "日志无变化"; else
            git commit -m "CI: msgvideo build log [skip ci]"; git push
          fi

      - name: Verify binaries
        run: |
          cd "$GITHUB_WORKSPACE/src/msgvideo"
          BIN=$(find .theos -path "*MsgVideoPrefs.bundle/MsgVideoPrefs" | head -1)
          DYLIB=$(find .theos -name "MsgVideo.dylib" | head -1)
          echo "== prefs =="
          file "$BIN"
          lipo -info "$BIN"
          echo "== dylib =="
          file "$DYLIB"
          lipo -info "$DYLIB"

      - name: Publish to repo (deb + Packages 索引)
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -f debs/com.xiaofei.msgbgvideo_*.deb
          cp src/msgvideo/packages/*.deb debs/
          dpkg-scanpackages --multiversion debs /dev/null > Packages
          gzip -k -f Packages
          xz -k -f Packages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debs Packages Packages.gz Packages.xz
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "CI: macOS 编译 信息视频背景 (arm64e fat binary) [skip ci]"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: msgvideo-deb
          path: src/msgvideo/packages/*.deb
