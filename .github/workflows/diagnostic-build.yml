name: build-diagnostic-deb
on:
  workflow_dispatch:
  push:
    branches: [diagnostic/media-live-tree]
    paths: ['diagnostic/**', '.github/workflows/diagnostic-build.yml']
permissions:
  contents: read
concurrency:
  group: diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos and iOS SDK
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          rm -rf "$HOME/theos/sdks"
          mv "$RUNNER_TEMP/theos-sdks" "$HOME/theos/sdks"
          find "$HOME/theos/sdks" -maxdepth 1 -name 'iPhoneOS*.sdk' | grep .
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> "$GITHUB_ENV"
      - name: Install build tools
        run: brew install --quiet ldid dpkg make
      - name: Build diagnostic only
        working-directory: diagnostic
        run: make clean package FINALPACKAGE=1
      - name: Verify package boundary
        run: |
          deb=$(find diagnostic/packages -name '*.deb' -type f | head -n 1)
          test -n "$deb"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = com.minis.lockmessagevideo.diagnostic
          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-deb
          path: diagnostic/packages/*.deb
          if-no-files-found: error
