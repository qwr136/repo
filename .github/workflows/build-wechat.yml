name: Build WeChatKeyboardToolbar (macOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/wechatkeyboardtoolbar/**'

# 需要写权限：把编好的 deb 提交到专用分支（绕开本机下载 Azure Blob 的 DNS 污染）
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install ldid xz dpkg

      - name: Setup Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C $HOME/theos/sdks --strip-components=1

      - name: 用 Xcode iPhoneOS SDK 替换 theos 自带 SDK（版本匹配、swiftmodules 完整）
        run: |
          export THEOS=$HOME/theos
          XCODE_SDK=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)
          SDK_VER=$(basename "$XCODE_SDK" | sed -E 's/^iPhoneOS//; s/\.sdk$//')
          echo "Xcode iPhoneOS SDK: $XCODE_SDK (ver=$SDK_VER)"
          echo "=== theos/sdks 现有内容 ==="
          ls -la "$THEOS/sdks" 2>&1 | head
          if [ -n "$XCODE_SDK" ] && [ -d "$XCODE_SDK/usr/lib/swift" ]; then
            # theos/sdks 自带的 iPhoneOS14.5.sdk 是老 SDK，其预编译 swiftmodules 与
            # Xcode 26 的 swift-frontend 不兼容 → 隐式导入 _Concurrency 失败并 signal 6 崩溃。
            # 直接把 theos SDK 指向 Xcode 自带的、版本完全匹配的 iPhoneOS SDK（符号链接）。
            for d in iPhoneOS.sdk iPhoneOS14.5.sdk iPhoneOS14.0.sdk "iPhoneOS${SDK_VER}.sdk"; do
              rm -rf "$THEOS/sdks/$d"; ln -s "$XCODE_SDK" "$THEOS/sdks/$d"
            done
            # CI 内把 Makefile 的 TARGET 改成 Xcode 匹配版本 + 安全 min deployment（不落库）
            sed -i.bak -E "s/iphone:[0-9.]+:[0-9.]+/iphone:${SDK_VER}:15.0/" src/wechatkeyboardtoolbar/Makefile
            echo "=== 改后 TARGET ==="; grep TARGET src/wechatkeyboardtoolbar/Makefile
            echo "=== swiftmodules 检查 ==="
            ls -d "$XCODE_SDK/usr/lib/swift/arm64-apple-ios.swiftmodule" 2>&1 || true
            ls "$XCODE_SDK/usr/lib/swift/arm64-apple-ios.swiftmodule/_Concurrency.swiftmodule" 2>&1 | head || true
          else
            echo "!!! 未找到 Xcode iPhoneOS SDK 的 usr/lib/swift: $XCODE_SDK"
          fi

      - name: Build (arm64 + arm64e fat, -Onone 避免 GitHub runner 上 swiftc 被 OOM kill)
        run: |
          export THEOS=$HOME/theos
          export THEOS_SDK_PATH="$THEOS/sdks/iPhoneOS.sdk"
          cd src/wechatkeyboardtoolbar
          make clean
          # 不用 FINALPACKAGE → swift 走 -Onone，内存占用大幅降低，绕开 signal 9 (OOM)
          make package 2>&1 | tee "$GITHUB_WORKSPACE/wk-build.log"
          ls -la packages/ 2>&1

      - name: Repack deb to gzip (iOS 兼容，防 Bad Deb)
        run: |
          cd "$GITHUB_WORKSPACE/src/wechatkeyboardtoolbar/packages"
          python3 "$GITHUB_WORKSPACE/.github/scripts/repack_gzip.py"

      - name: Verify deb (control 单行 + gzip + 架构 iphoneos-arm64)
        run: |
          cd "$GITHUB_WORKSPACE/src/wechatkeyboardtoolbar/packages"
          for d in *.deb; do
            dpkg-deb -I "$d" > /dev/null
            dpkg-deb -c "$d" > /dev/null
          done
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify_deb.py"

      - name: 提交 deb 到专用分支 wechat-deb（绕开本机下载 Azure Blob 的 DNS 污染）
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p debs
          cp src/wechatkeyboardtoolbar/packages/*.deb debs/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B wechat-deb
          git add debs/*.deb
          git commit -m "CI: WeChatKeyboardToolbar deb [skip ci]" || echo "无变化"
          git push --force origin wechat-deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: src/wechatkeyboardtoolbar/packages/*.deb
